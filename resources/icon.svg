<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Terminal Reader for Claude">
  <title>Terminal Reader for Claude</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1410"/>
      <stop offset="100%" stop-color="#2a1a14"/>
    </linearGradient>
    <linearGradient id="ray-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a5a"/>
      <stop offset="100%" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="ray-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#a04020"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb27a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#d97757" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef6e9"/>
      <stop offset="100%" stop-color="#f5e6c8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="22" fill="url(#bg)"/>

  <circle cx="64" cy="64" r="56" fill="url(#glow)"/>

  <g transform="translate(64 64)">
    <g fill="url(#ray-deep)">
      <path d="M0,-46 L6,-12 L-6,-12 Z"/>
      <path d="M0,46 L6,12 L-6,12 Z"/>
      <path d="M-46,0 L-12,6 L-12,-6 Z"/>
      <path d="M46,0 L12,6 L12,-6 Z"/>
    </g>
    <g fill="url(#ray-warm)" transform="rotate(45)">
      <path d="M0,-40 L5,-10 L-5,-10 Z"/>
      <path d="M0,40 L5,10 L-5,10 Z"/>
      <path d="M-40,0 L-10,5 L-10,-5 Z"/>
      <path d="M40,0 L10,5 L10,-5 Z"/>
    </g>
    <g fill="#ffc89a" transform="rotate(22.5)" opacity="0.85">
      <path d="M0,-34 L4,-9 L-4,-9 Z"/>
      <path d="M0,34 L4,9 L-4,9 Z"/>
      <path d="M-34,0 L-9,4 L-9,-4 Z"/>
      <path d="M34,0 L9,4 L9,-4 Z"/>
    </g>
    <circle r="7.5" fill="#fef6e9"/>
    <circle r="3.5" fill="#d97757"/>
  </g>

  <g transform="translate(64 64)" fill="url(#prompt)" stroke="#1f1410" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-30,-18 L-10,0 L-30,18 L-26,18 L-6,0 L-26,-18 Z"/>
